name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install aiohttp "sqlalchemy[asyncio]" aiomysql aiosqlite cryptography redis \
            pydantic pydantic-settings python-dotenv fastapi "uvicorn[standard]" structlog websockets \
            pytest pytest-asyncio pytest-cov ruff

      - name: Lint (ruff)
        run: ruff check .

      - name: Run tests with coverage
        run: python -m pytest -q --cov --cov-report=term-missing --cov-fail-under=75
