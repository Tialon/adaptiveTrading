name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install aiohttp "sqlalchemy[asyncio]" aiomysql aiosqlite cryptography redis \
            pydantic pydantic-settings python-dotenv fastapi "uvicorn[standard]" structlog websockets \
            pytest pytest-asyncio pytest-cov ruff

      - name: Lint (ruff)
        run: ruff check .

      - name: Run tests with coverage
        # -m "not testnet" 显式排除真实币安测试网冒烟(需 RUN_TESTNET_SMOKE=true + 网络,
        # CI 永不触发)。冒烟测试仍靠自身 fixture 双重兜底(未设 env 则 skip), 双保险。
        run: python -m pytest -q --cov --cov-report=term-missing --cov-fail-under=75 -m "not testnet"
