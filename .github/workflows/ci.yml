name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # 依赖单一来源: pyproject.toml + uv.lock 是唯一真相, 不再在 CI 硬编码 pip 列表。
      # uv sync --frozen 强制 lockfile 与 pyproject 同步(漂移即失败), 保证 CI 与本地
      # `uv sync` 环境逐包一致; --extra dev 装 pytest/ruff 等开发依赖; --no-install-project
      # 只装依赖、不尝试构建(本项目为扁平 atXX 目录, 无 build-system, 无需安装项目本身)。
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --extra dev --no-install-project

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Run tests with coverage
        # -m "not testnet" 显式排除真实币安测试网冒烟(需 RUN_TESTNET_SMOKE=true + 网络,
        # CI 永不触发)。冒烟测试仍靠自身 fixture 双重兜底(未设 env 则 skip), 双保险。
        run: uv run pytest -q --cov --cov-report=term-missing --cov-fail-under=75 -m "not testnet"
