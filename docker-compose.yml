# V11.8 §4: 生产 docker-compose.yml(单容器, SQLite 持久化)
#
# 用法:
#   # 开发: cp .env.example .env && docker compose up -d
#   # Pi生产: docker compose --env-file /etc/adaptive-trading/production.env up -d
#   #         production.env 内必须令 ADAPTIVE_TRADING_ENV_FILE 指向自身。
#   docker compose ps         # 状态
#   docker compose logs -f    # 日志
#   docker compose restart    # 重启(restart: unless-stopped, 主机/守护重启自动拉起)
#   docker compose down       # 停止(不删卷, 数据保留在 ./data ./logs ./evidence)
#
# 说明:
# - 数据/日志/证据/日报分别挂载到宿主机目录(持久化, 非 tmpfs); Pi 应指向 SSD。
# - 密钥只经外置 env_file 注入, 不进镜像/不落 Git(.dockerignore + .gitignore 兜底)。
# - health=OK 仅表示「HTTP 服务可达」, 不等于「可买」(can_buy 由 TradingGate 单一权威判定)。
# - 生产镜像请用 git_sha 打 tag(如 adaptive-trading:3df9e632), 勿用裸 latest。

services:
  adaptive-trading:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # 把当前 git SHA 打进镜像(容器内无 .git); 供启动日志/主网就绪自检/soak 证据追踪版本
        GIT_SHA: ${GIT_SHA:-unknown}
        # 镜像源/依赖源(供防火墙/镜像站环境, 如 Pi 上 docker.io/pypi.org 被墙):
        # 默认取 Dockerfile ARG(走 docker.io / pypi.org); 被墙时在 .env 覆盖为镜像站。
        PYTHON_BASE: ${PYTHON_BASE:-python:3.13-slim}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
        UV_DEFAULT_INDEX: ${UV_DEFAULT_INDEX:-https://pypi.org/simple}
    # 生产镜像用 git_sha 打 tag(如 adaptive-trading:31262e91), 由 .env 的 IMAGE_TAG 注入;
    # 缺省回退 local(仅本地开发)。勿用裸 latest。
    image: adaptive-trading:${IMAGE_TAG:-local}
    container_name: adaptive-trading
    restart: unless-stopped

    env_file:
      # 默认兼容本地 .env；生产用 --env-file 加载外置配置，并在其中设置本变量为同一路径。
      - ${ADAPTIVE_TRADING_ENV_FILE:-./.env}

    environment:
      # 容器内监听 0.0.0.0 供端口映射 + healthcheck 访问
      API_HOST: "0.0.0.0"
      API_PORT: "8800"
      # SQLite 落在挂载卷(宿主机 ./data/adaptive.db); 4 斜杠 = 绝对路径 /app/data/adaptive.db
      DATABASE_URL: "sqlite+aiosqlite:////app/data/adaptive.db"
      LOG_FILE: "/app/logs/adaptive.log"
      DAILY_REPORT_DIR: "/app/reports"
      # 版本追踪: 把 tag/git_sha 显式注入容器环境(与镜像内 ENV GIT_SHA 二选一, 以 env 为准)
      IMAGE_TAG: ${IMAGE_TAG:-local}
      GIT_SHA: ${GIT_SHA:-unknown}

    # V12 §5: 局域网 Web(端口映射到宿主机所有网卡, 供 Pi 局域网内访问 Dashboard)。
    # 容器内 API_HOST 已固定 0.0.0.0; 写接口鉴权由 WEB_ADMIN_TOKEN fail-closed 兜底 ——
    # 非回环 API_HOST + 空 WEB_ADMIN_TOKEN 会被 validate() 直接拒绝启动(见 settings.py)。
    # 明确风险: 0.0.0.0 会把面板暴露到整个局域网, 务必在 .env 配置强 WEB_ADMIN_TOKEN。
    ports:
      - "8800:8800"

    volumes:
      - ${HOST_DATA_DIR:-./data}:/app/data
      - ${HOST_LOGS_DIR:-./logs}:/app/logs
      - ${HOST_EVIDENCE_DIR:-./evidence}:/app/evidence
      - ${HOST_REPORTS_DIR:-./reports}:/app/reports
      # 外置配置目录。
      #
      # V12.9 修正了这条注释的角色描述 —— V12.6 P1 起**可编辑字段已改存数据库**
      # (`runtime_config` 表, 优先级 DB > env > default), 因此本卷**不再**是
      # 管理页面的配置写入目标。它现在的真实用途是:
      #   ① 读取参照: 页面显示「文件值 vs 运行值」差异与 `pending_restart`;
      #   ② 回滚来源: `POST /api/admin/config/rollback` 恢复 `<file>.bak.<时间戳>`;
      #   ③ 密钥与 bootstrap 键(仍只存在于文件/env, 绝不入库)。
      # 即: **Pi 上配 DNS 时不再需要 `chown -R 999:999`** —— 改模式/改参数走数据库即可;
      # 只有想用「文件差异对比」或「文件回滚」时才需要该卷可读写。
      # Pi: 设 HOST_CONFIG_DIR=/etc/adaptive-trading(见 docs/raspberry-pi-deployment.md)。
      # 本地: 默认 ./config(空目录亦无害)。
      - ${HOST_CONFIG_DIR:-./config}:/etc/adaptive-trading

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8800/api/health', timeout=3).status==200 else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
